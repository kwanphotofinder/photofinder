# ==============================================================================
# Photo Finder — GitLab CI/CD Pipeline Configuration (.gitlab-ci.yml)
# ==============================================================================
# Stages:
#   1. test     - Code validation, linting & build verification
#   2. build    - Build Docker images and push to GitLab Container Registry
#   3. deploy   - Automated rollout to Kubernetes (Namespace: photofinder)
# ==============================================================================

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_WEB: "$CI_REGISTRY_IMAGE/web"
  IMAGE_AI: "$CI_REGISTRY_IMAGE/ai-service"
  DATABASE_URL: "postgresql://ci_dummy:ci_dummy@localhost:5432/ci_dummy"
  DIRECT_URL: "postgresql://ci_dummy:ci_dummy@localhost:5432/ci_dummy"
  JWT_SECRET: "ci-test-jwt-secret-key-12345"

# ==============================================================================
# STAGE 1: TEST & VALIDATION
# ==============================================================================

test:web:
  stage: test
  image: node:20-alpine
  before_script:
    - apk add --no-cache libc6-compat
    - cd photofinder-nextjs
  script:
    - npm ci
    - npx prisma generate
    - npx next build
  cache:
    key:
      files:
        - photofinder-nextjs/package-lock.json
    paths:
      - photofinder-nextjs/node_modules/
      - photofinder-nextjs/.next/cache/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

test:ai-service:
  stage: test
  image: python:3.10-slim
  before_script:
    - cd ai-service
    - apt-get update && apt-get install -y --no-install-recommends gcc libgl1 libglib2.0-0
  script:
    - python -m py_compile main.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==============================================================================
# STAGE 2: BUILD DOCKER IMAGES & PUSH TO GITLAB REGISTRY
# ==============================================================================

.docker_build_template:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:web:
  extends: .docker_build_template
  script:
    - cd photofinder-nextjs
    - |
      docker build \
        --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${NEXT_PUBLIC_GOOGLE_CLIENT_ID}" \
        -t "$IMAGE_WEB:$CI_COMMIT_SHORT_SHA" \
        -t "$IMAGE_WEB:$CI_COMMIT_REF_SLUG" \
        -t "$IMAGE_WEB:latest" \
        .
    - docker push "$IMAGE_WEB:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_WEB:$CI_COMMIT_REF_SLUG"
    - docker push "$IMAGE_WEB:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

build:ai-service:
  extends: .docker_build_template
  script:
    - cd ai-service
    - |
      docker build \
        -t "$IMAGE_AI:$CI_COMMIT_SHORT_SHA" \
        -t "$IMAGE_AI:$CI_COMMIT_REF_SLUG" \
        -t "$IMAGE_AI:latest" \
        .
    - docker push "$IMAGE_AI:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_AI:$CI_COMMIT_REF_SLUG"
    - docker push "$IMAGE_AI:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==============================================================================
# STAGE 3: DEPLOY TO KUBERNETES (NAMESPACE: photofinder)
# ==============================================================================

deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl config get-contexts || true
    - echo "Deploying to Kubernetes namespace photofinder..."
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/configmap.yaml
    - kubectl apply -f k8s/postgres.yaml
    - 'sed -i "s|image: photofinder-web:latest|image: $IMAGE_WEB:$CI_COMMIT_SHORT_SHA|g" k8s/web.yaml'
    - 'sed -i "s|image: photofinder-ai:latest|image: $IMAGE_AI:$CI_COMMIT_SHORT_SHA|g" k8s/ai-service.yaml'
    - kubectl apply -f k8s/ai-service.yaml
    - kubectl apply -f k8s/web.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl rollout status deployment/web -n photofinder --timeout=180s || true
    - kubectl rollout status deployment/ai-service -n photofinder --timeout=180s || true
  environment:
    name: staging
    url: https://photofinder.mfu.ac.th
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy:production:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to Production Kubernetes cluster..."
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/configmap.yaml
    - kubectl apply -f k8s/postgres.yaml
    - 'sed -i "s|image: photofinder-web:latest|image: $IMAGE_WEB:$CI_COMMIT_SHORT_SHA|g" k8s/web.yaml'
    - 'sed -i "s|image: photofinder-ai:latest|image: $IMAGE_AI:$CI_COMMIT_SHORT_SHA|g" k8s/ai-service.yaml'
    - kubectl apply -f k8s/ai-service.yaml
    - kubectl apply -f k8s/web.yaml
    - kubectl apply -f k8s/ingress.yaml
    - kubectl rollout status deployment/web -n photofinder --timeout=180s
    - kubectl rollout status deployment/ai-service -n photofinder --timeout=180s
  environment:
    name: production
    url: https://photofinder.mfu.ac.th
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
