apiVersion: apps/v1
kind: Deployment
metadata:
  name: photofinder-ai
  labels:
    app.kubernetes.io/name: photofinder-ai
spec:
  replicas: {{ .Values.ai.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: photofinder-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photofinder-ai
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret | quote }}
      containers:
        - name: ai-service
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          imagePullPolicy: {{ .Values.ai.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ai.port }}
          env:
            - name: PORT
              value: {{ .Values.ai.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
{{ toYaml .Values.ai.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: photofinder-ai
spec:
  selector:
    app.kubernetes.io/name: photofinder-ai
  ports:
    - name: http
      port: {{ .Values.ai.port }}
      targetPort: http

