imagePullSecret: harbor-registry
runtimeSecret: photofinder-runtime

web:
  replicas: 2
  image:
    repository: hub-registry.mfu.ac.th/photofinder/web
    tag: replace-with-full-develop-sha
    digest: ""
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

ai:
  replicas: 1
  image:
    repository: hub-registry.mfu.ac.th/photofinder/ai-service
    tag: replace-with-full-develop-sha
    digest: ""
    pullPolicy: IfNotPresent
  port: 7860
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

ingress:
  className: nginx
  host: photofinder.mfu.ac.th
  tls:
    enabled: false
    secretName: ""

podDisruptionBudget:
  webMinAvailable: 1

