apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: photofinder
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: photofinder-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7860
              name: http
          env:
            - name: PORT
              value: "7860"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: photofinder
  labels:
    app: ai-service
spec:
  ports:
    - port: 7860
      targetPort: 7860
      name: http
  selector:
    app: ai-service
  type: ClusterIP
