apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: photofinder
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: photofinder-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: photofinder-secrets
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: photofinder-secrets
                  key: DIRECT_URL
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: photofinder-config
                  key: AI_SERVICE_URL
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: photofinder-config
                  key: NEXT_PUBLIC_API_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: photofinder-secrets
                  key: JWT_SECRET
            - name: CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: photofinder-secrets
                  key: CLOUDINARY_URL
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1.5"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/ai-health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: photofinder
  labels:
    app: web
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
      nodePort: 30080
  selector:
    app: web
  type: NodePort
